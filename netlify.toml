[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Every page has its own HTML file from the build. Anything else falls back to the app,
# which shows a "page not found" message.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache the hashed build files for a year. They get new names whenever they change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
